# 票夹通 Compose（engineering-plan §5：--profile dev 为本地开发；生产形态 M3 补 caddy/api）
name: ticketwallet

services:
  postgres:
    # dev 用本地已有镜像（标准 PG16 超集，含 contrib/pg_trgm）；生产镜像仍按 tech-stack §6.1 用 postgres:16-alpine
    image: pgvector/pgvector:pg16
    profiles: ["dev"]
    environment:
      POSTGRES_USER: tw
      POSTGRES_PASSWORD: tw_dev_password
      POSTGRES_DB: ticketwallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tw -d ticketwallet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
