name: ticketwallet-prod

services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}   # 本地彩排 :80（HTTP）；生产填真实域名走 ACME
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/dist:/srv/web:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 96M }

  api:
    image: ticketwallet-api:latest
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketwallet?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-tw}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?请在 .env 提供}
      APP_STORAGE_ROOT: /data/attachments
      TZ: Asia/Shanghai
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 768M }   # tech-stack §6.2 预算：RSS ≤550MB 目标

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-tw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 提供}
      POSTGRES_DB: ticketwallet
    command: ["postgres","-c","shared_buffers=128MB","-c","max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-tw} -d ticketwallet"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }

volumes:
  pgdata:
  attachments:
  caddy_data:
