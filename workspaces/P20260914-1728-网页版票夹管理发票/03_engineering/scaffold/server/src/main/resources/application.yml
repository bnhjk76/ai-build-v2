spring:
  application:
    name: ticketwallet-server
  datasource:
    # spike发现#3：PG enum 列要求 stringtype=unspecified（JDBC 驱动按上下文推断类型），否则 varchar→enum 报错
    url: jdbc:postgresql://localhost:5432/ticketwallet?stringtype=unspecified
    username: tw
    password: tw_dev_password
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    # spike发现#4：Boot 4 无 spring.session.store-type / cookie-name（仓库类型由 classpath 决定；
    # cookie 配置走 server.servlet.session.cookie.*）
    timeout: 7d
    jdbc:
      initialize-schema: always

server:
  port: 8080

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 15MB

app:
  storage:
    root: ./data/attachments
  servlet:
    session:
      cookie:
        name: tw_session

mybatis-flex:
  global-config:
    print-banner: false

logging:
  level:
    com.ticketwallet: DEBUG
